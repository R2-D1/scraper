<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media Library Viewer</title><link rel="stylesheet" href="/styles.css"></head><body><main><aside><div id="summary" class="sidebar-summary"></div><input id="search" placeholder="Пошук за назвою, slug або тегом"><div id="collections"></div></aside><section><div class="toolbar"><button id="back" hidden>← Колекції</button><h2 id="title">Колекції</h2><span id="count"></span><div id="group-actions" class="group-actions" hidden><strong id="group-count"></strong><button id="group-clear" type="button">Очистити</button><button id="group-disband" type="button" hidden>Розформувати</button><button id="group-save" type="button">Створити групу</button><button id="collection-assign" type="button" hidden>Перенести в колекцію</button></div><button id="reload-library" type="button" title="Перечитати локальні реєстри та метадані">Перечитати бібліотеку</button></div><div id="grid" class="collection-grid"></div></section></main><dialog id="editor"><form method="dialog"><button class="close">×</button><div id="editor-body"></div><div class="actions"><button id="delete" type="button" class="danger">Видалити</button><button value="cancel">Скасувати</button><button id="save" value="default">Зберегти</button></div></form></dialog><dialog id="group-editor"><form method="dialog"><button class="close">×</button><div id="group-editor-body"></div><div class="actions"><button value="cancel">Скасувати</button><button value="default">Зберегти групу</button></div></form></dialog><dialog id="collection-editor"><form method="dialog"><button class="close">×</button><div id="collection-editor-body"></div><div class="actions"><button value="cancel">Скасувати</button><button value="default">Перенести</button></div></form></dialog><script src="/app.js"></script></body></html>
