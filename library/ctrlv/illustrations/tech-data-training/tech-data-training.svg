<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <g class="anim-float">
                <!-- Large Funnel -->
                <path d="M100 60 H300 L220 180 V240 L180 260 V180 L100 60 Z" fill="#ffffff" stroke="#334155" stroke-width="8" stroke-linejoin="round"/>
                
                <!-- Raw Data (Incoming) -->
                <g class="anim-bounce" >
                    <circle cx="150" cy="40" r="8" fill="#6366f1"/>
                    <rect x="220" y="30" width="12" height="12" fill="#f43f5e"/>
                    <path d="M200 20 L210 40 L190 40 Z" fill="#0ea5e9"/>
                </g>
                
                <!-- Inside Funnel (Processing) -->
                <g class="anim-pulse"  opacity="0.4">
                    <circle cx="200" cy="100" r="10" fill="#6366f1"/>
                    <circle cx="170" cy="130" r="6" fill="#f43f5e"/>
                    <circle cx="230" cy="130" r="6" fill="#0ea5e9"/>
                </g>
                
                <!-- Structured Data (Outgoing) -->
                <g transform="translate(200, 275)">
<g class="anim-draw" >
                    <rect class="anim-bounce" x="-15" y="0" width="30" height="10" rx="2" fill="#0ea5e9"/>
                </g>
</g>
                
                <!-- Analysis Waves -->
                <path class="anim-draw" d="M140 120 Q200 150 260 120" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4"/>
            </g>
          </svg>