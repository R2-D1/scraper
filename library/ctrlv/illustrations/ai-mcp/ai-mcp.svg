<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <g class="anim-float">
                <!-- AI Model Node -->
                <rect x="60" y="110" width="80" height="80" rx="15" fill="#6366f1"/>
                <circle class="anim-pulse" cx="100" cy="150" r="15" fill="#ffffff"/>
                
                <!-- External Tool Node -->
                <rect x="260" y="110" width="80" height="80" rx="15" fill="#f43f5e"/>
                <rect class="anim-pulse" style="animation-delay: 0.5s;" x="285" y="135" width="30" height="30" rx="5" fill="#ffffff"/>
                
                <!-- Protocol Bridge -->
                <path d="M140 150 H260" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
                <path class="anim-data" d="M140 150 H260" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
                
                <!-- Context Packets -->
                <g class="anim-draw">
                    <rect x="170" y="110" width="20" height="15" rx="4" fill="#0ea5e9"/>
