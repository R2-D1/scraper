            <ellipse class="anim-glow" cx="200" cy="160" rx="160" ry="80" stroke="#334155" stroke-width="1" stroke-dasharray="4 8" fill="none" opacity="0.4"/>
            <!-- Central Planet Hub -->
            <circle class="anim-float" cx="200" cy="160" r="50" fill="#6366f1"/>
