<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <g class="anim-float">
                <!-- Folding Hexagon / Origami Structure -->
                <polygon points="150,80 250,80 300,150 250,220 150,220 100,150" fill="#6366f1" opacity="0.2" stroke="#6366f1" stroke-width="2"/>
                
                <!-- Folded facets -->
                <polygon points="150,80 250,80 200,150" fill="#6366f1" opacity="0.8"/>
                <polygon points="150,80 100,150 200,150" fill="#f43f5e"/>
                <polygon points="250,80 300,150 200,150" fill="#0ea5e9"/>
                
                <!-- Transforming / Folding Flaps -->
                <g class="anim-rotate" >
                    <polygon points="250,220 150,220 200,150" fill="#6366f1" opacity="0.5"/>
                    <path class="anim-pulse" d="M200 150 L250 220 L150 220 Z" stroke="#ffffff" stroke-width="4" fill="none"/>
                </g>
                
                <!-- Quantum Nodes -->
                <circle class="anim-glow" cx="200" cy="150" r="12" fill="#ffffff"/>
                <circle class="anim-pulse" cx="150" cy="80" r="8" fill="#0ea5e9"/>
                <circle class="anim-pulse" cx="250" cy="80" r="8" fill="#f43f5e"/>
                <circle class="anim-pulse" cx="100" cy="150" r="8" fill="#0ea5e9"/>
                <circle class="anim-pulse" cx="300" cy="150" r="8" fill="#6366f1"/>
            </g>
          </svg>