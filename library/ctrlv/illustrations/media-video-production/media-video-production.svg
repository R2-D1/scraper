<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <g class="anim-float">
                <!-- Clapperboard Base -->
                <rect x="100" y="100" width="200" height="140" fill="#334155"/>
                <rect x="100" y="100" width="200" height="40" fill="#6366f1"/>
                
                <!-- Clapper Top -->
                <g class="anim-rotate" >
                    <rect x="100" y="70" width="200" height="30" fill="#334155"/>
                    <!-- Stripes -->
                    <path d="M120 70 L140 100 M160 70 L180 100 M200 70 L220 100 M240 70 L260 100" stroke="#ffffff" stroke-width="8"/>
                </g>
                
                <!-- Stripes on base top part -->
                <path d="M110 100 L130 140 M150 100 L170 140 M190 100 L210 140 M230 100 L250 140" stroke="#ffffff" stroke-width="8"/>
                
                <!-- Action / Play Icon -->
                <g class="anim-pulse" >
                    <circle cx="200" cy="180" r="30" fill="#0ea5e9"/>
                    <path d="M190 165 L220 180 L190 195 Z" fill="#ffffff"/>
                </g>
                
                <!-- Film Reel (Left Focus) -->
                <g class="anim-rotate" >
                    <circle cx="80" cy="220" r="40" fill="none" stroke="#f43f5e" stroke-width="12" stroke-dasharray="20 40"/>
                    <circle cx="80" cy="220" r="10" fill="#334155"/>
                </g>
            </g>
          </svg>