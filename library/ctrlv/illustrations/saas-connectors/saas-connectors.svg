<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            
            <!-- Connector Left -->
            <g class="anim-bounce">
                <rect x="60" y="120" width="100" height="60" rx="10" fill="#6366f1"/>
                <!-- Plug prongs extending right -->
                <rect x="160" y="135" width="30" height="10" fill="#334155" opacity="0.8"/>
                <rect x="160" y="155" width="30" height="10" fill="#334155" opacity="0.8"/>
            </g>
            
            <!-- Connector Right -->
            <g class="anim-bounce" style="animation-delay: -0.5s;">
                <rect x="240" y="120" width="100" height="60" rx="10" fill="#f43f5e"/>
                <!-- Socket holes -->
                <rect x="230" y="130" width="20" height="20" rx="4" fill="#ffffff"/>
                <rect x="230" y="150" width="20" height="20" rx="4" fill="#ffffff"/>
            </g>
            
            <!-- Magic Spark / Connection establishing -->
            <g class="anim-pulse" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round">
                <path d="M190 130 L200 120 M210 130 L200 140"/>
                <path d="M190 170 L200 180 M210 170 L200 160"/>
                <circle cx="200" cy="150" r="4" fill="#0ea5e9" stroke="none"/>
            </g>
            
            <!-- Flowing Data Ring -->
            <ellipse class="anim-pulse" style="animation-duration: 3s;" cx="200" cy="150" rx="120" ry="80" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="10 10" opacity="0.2"/>
          </svg>