                <!-- Buck Teeth -->
                <rect x="185" y="202" width="12" height="15" fill="#ffffff"/>
                <rect x="203" y="202" width="12" height="15" fill="#ffffff"/>
                
                <!-- Glasses -->
                <circle cx="160" cy="130" r="30" stroke="#334155" stroke-width="8" fill="#ffffff" opacity="0.9"/>
                <circle cx="240" cy="130" r="30" stroke="#334155" stroke-width="8" fill="#ffffff" opacity="0.9"/>
                <path d="M190 130 H210" stroke="#334155" stroke-width="8"/>
                <path d="M130 130 H100 M270 130 H300" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
                
                <!-- Eyes in Glasses -->
