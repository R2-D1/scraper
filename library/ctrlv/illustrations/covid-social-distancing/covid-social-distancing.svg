<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <ellipse cx="200" cy="270" rx="160" ry="10" fill="#E2E8F0" opacity="0.6"/>
            
            <g class="anim-float">
                <!-- Person 1 -->
                <circle cx="100" cy="100" r="25" fill="#6366f1"/>
                <path d="M60 250 C60 160 140 160 140 250 Z" fill="#6366f1"/>
                
                <!-- Person 2 -->
                <circle cx="300" cy="100" r="25" fill="#f43f5e"/>
                <path d="M260 250 C260 160 340 160 340 250 Z" fill="#f43f5e"/>
                
                <!-- Distance Marker Arrow -->
                <g class="anim-pulse">
                    <line x1="160" y1="180" x2="240" y2="180" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>
                    <path d="M170 165 L150 180 L170 195 Z" fill="#0ea5e9"/>
                    <path d="M230 165 L250 180 L230 195 Z" fill="#0ea5e9"/>
                    
                    <!-- Measurement Line -->
                    <line x1="150" y1="150" x2="150" y2="210" stroke="#0ea5e9" stroke-width="4" stroke-dasharray="6 6"/>
                    <line x1="250" y1="150" x2="250" y2="210" stroke="#0ea5e9" stroke-width="4" stroke-dasharray="6 6"/>
                    
                    <!-- Text simulation -->
                    <rect x="180" y="140" width="40" height="20" rx="5" fill="#ffffff" stroke="#0ea5e9" stroke-width="3"/>
                    <line x1="190" y1="150" x2="210" y2="150" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>
                </g>
            </g>
          </svg>