                <!-- Inner Dials / Tech -->
                <circle cx="200" cy="150" r="50" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
                
                <!-- Hands -->
                <g class="anim-rotate" >
                    <path d="M200 150 L200 110" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
                </g>
                <g class="anim-rotate" >
                    <path d="M200 150 L235 150" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>
