                <rect x="170" y="40" width="60" height="220" rx="4" fill="#f43f5e"/>
                <path d="M160 80 H240 M160 220 H240" stroke="#0ea5e9" stroke-width="4"/>
                
                <!-- Watch Face Base -->
                <circle cx="200" cy="150" r="70" fill="#6366f1"/>
                <circle cx="200" cy="150" r="60" fill="white"/>
                
                <!-- Crown / Button -->
