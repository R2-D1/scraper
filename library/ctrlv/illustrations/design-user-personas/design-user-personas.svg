<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <g class="anim-float">
                <!-- Main Profile Card -->
                <rect x="60" y="50" width="280" height="200" rx="12" fill="#ffffff" stroke="#334155" stroke-width="8"/>
                
                <!-- Avatar -->
                <g class="anim-bounce" >
                    <circle cx="130" cy="120" r="40" fill="#6366f1" opacity="0.2"/>
                    <circle cx="130" cy="110" r="15" fill="#6366f1"/>
                    <path d="M100 150 Q130 120 160 150 Z" fill="#6366f1"/>
                </g>
                
                <!-- Info Bars -->
                <rect x="190" y="90" width="120" height="15" rx="4" fill="#334155" opacity="0.2"/>
                <rect x="190" y="115" width="100" height="15" rx="4" fill="#334155" opacity="0.2"/>
                
                <!-- Demographic Data Rings -->
                <g transform="translate(130, 200)">
                    <circle class="anim-pulse" cx="-60" cy="0" r="20" fill="none" stroke="#f43f5e" stroke-width="8" stroke-dasharray="80 125"/>
                    <circle class="anim-pulse" style="animation-delay: 0.2s;" cx="0" cy="0" r="20" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-dasharray="100 125"/>
                    <circle class="anim-pulse" style="animation-delay: 0.4s;" cx="60" cy="0" r="20" fill="none" stroke="#6366f1" stroke-width="8" stroke-dasharray="60 125"/>
                </g>
                
                <text x="130" y="235" font-family="monospace" font-weight="bold" font-size="12" fill="#334155" text-anchor="middle">RESEARCH</text>
            </g>
          </svg>