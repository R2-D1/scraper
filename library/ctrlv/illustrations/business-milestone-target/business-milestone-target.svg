<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <g class="anim-float">
                <!-- Bullseye Board -->
                <circle cx="200" cy="180" r="80" fill="#ffffff" stroke="#334155" stroke-width="8"/>
                <circle cx="200" cy="180" r="50" fill="#f43f5e"/>
                <circle cx="200" cy="180" r="20" fill="#0ea5e9"/>
                <path d="M120 180 H280 M200 100 V260" stroke="#334155" stroke-width="4" opacity="0.2"/>
                
                <!-- Stand -->
                <path d="M180 260 L140 320 H260 L220 260" fill="#334155"/>
                
                <!-- Dart/Arrow 1 -->
