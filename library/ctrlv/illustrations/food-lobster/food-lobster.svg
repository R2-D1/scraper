<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <g class="anim-float">
                <!-- Large Platter -->
                <ellipse cx="200" cy="200" rx="130" ry="60" fill="#ffffff" stroke="#6366f1" stroke-width="4"/>
                <ellipse cx="200" cy="200" rx="110" ry="40" fill="#f43f5e" opacity="0.2"/>
                
                <!-- Lobster Centerpiece -->
                <g class="anim-bounce">
                    <!-- Body -->
                    <path d="M160 200 Q200 160 240 200" stroke="#6366f1" stroke-width="20" stroke-linecap="round" fill="none"/>
                    <!-- Tail -->
                    <path d="M240 200 L270 210 L270 190 Z" fill="#6366f1"/>
                    <!-- Claws -->
                    <path d="M160 200 Q140 150 120 170" stroke="#6366f1" stroke-width="12" stroke-linecap="round" fill="none"/>
                    <path d="M160 200 Q140 250 120 230" stroke="#6366f1" stroke-width="12" stroke-linecap="round" fill="none"/>
                </g>
                
                <!-- Garnish (Lemon/Herbs) -->
                <circle cx="140" cy="220" r="10" fill="#0ea5e9"/>
                <circle cx="260" cy="180" r="8" fill="#f43f5e"/>
            </g>
          </svg>