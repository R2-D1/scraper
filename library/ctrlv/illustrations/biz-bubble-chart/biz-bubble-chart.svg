<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <ellipse cx="200" cy="270" rx="140" ry="10" fill="#E2E8F0" opacity="0.6"/>
            <!-- Axes -->
            <path d="M60 60 V240 H340" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
            
            <g class="anim-float-slow">
                <!-- Large Central Bubble -->
                <circle class="anim-pulse" cx="200" cy="150" r="60" fill="#6366f1" opacity="0.8"/>
                <circle cx="180" cy="130" r="15" fill="#ffffff" opacity="0.4"/>
                
                <!-- Medium Secondary Bubble -->
                <circle cx="110" cy="200" r="35" fill="#f43f5e" opacity="0.9"/>
                <circle cx="95" cy="190" r="8" fill="#ffffff" opacity="0.4"/>
                
                <!-- Medium Accent Bubble -->
                <circle cx="290" cy="100" r="45" fill="#0ea5e9" opacity="0.8"/>
                <circle cx="275" cy="85" r="10" fill="#ffffff" opacity="0.4"/>
                
                <!-- Small Floating Bubbles -->
                <g class="anim-bounce">
                    <circle cx="140" cy="80" r="20" fill="#f43f5e"/>
                    <circle cx="260" cy="210" r="25" fill="#0ea5e9" opacity="0.7"/>
                    <circle cx="330" cy="180" r="15" fill="#6366f1"/>
                    <circle cx="80" cy="120" r="12" fill="#ffffff" stroke="#6366f1" stroke-width="4"/>
                </g>
            </g>
          </svg>