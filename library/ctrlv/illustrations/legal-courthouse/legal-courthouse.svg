<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <g class="anim-float">
                <!-- Base Steps -->
                <rect x="80" y="240" width="240" height="10" fill="#f43f5e"/>
                <rect x="100" y="230" width="200" height="10" fill="#6366f1"/>
                
                <!-- Pillars -->
                <rect x="110" y="130" width="15" height="100" fill="#ffffff" stroke="#334155" stroke-width="2"/>
                <rect x="160" y="130" width="15" height="100" fill="#ffffff" stroke="#334155" stroke-width="2"/>
                <rect x="225" y="130" width="15" height="100" fill="#ffffff" stroke="#334155" stroke-width="2"/>
                <rect x="275" y="130" width="15" height="100" fill="#ffffff" stroke="#334155" stroke-width="2"/>
                
                <!-- Pediment (Roof) -->
                <path d="M80 130 L200 60 L320 130 Z" fill="#6366f1"/>
                
                <!-- Seal -->
                <circle class="anim-pulse" cx="200" cy="100" r="12" fill="#0ea5e9"/>
                <circle cx="200" cy="100" r="6" fill="#ffffff"/>
            </g>
          </svg>