<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
        <!-- Yoga Mat -->
        <rect x="60" y="240" width="280" height="8" rx="4" fill="#6366f1" opacity="0.2"/>
        
        <!-- Detailed Yoga Silhouette (Tree Pose) -->
        <g class="anim-float">
            <!-- Aura -->
            <circle cx="200" cy="150" r="60" fill="var(--primary-soft)" opacity="0.1"/>
            
            <!-- Head -->
            <circle cx="200" cy="80" r="20" fill="#6366f1"/>
            
            <!-- Body & Leg -->
            <path d="M200 100 V200 L200 240" stroke="#6366f1" stroke-width="10" stroke-linecap="round"/>
            
            <!-- Bent Leg -->
            <path class="anim-bounce" d="M200 200 L180 170 L200 170" stroke="#6366f1" stroke-width="8" stroke-linecap="round" fill="none"/>
            
            <!-- Arms Raised -->
            <path d="M200 130 L170 70 M200 130 L230 70" stroke="#6366f1" stroke-width="8" stroke-linecap="round" fill="none"/>
        </g>
        
        <!-- Floating Leaves/Nature elements -->
        <g class="anim-float" style="animation-delay: -2s">
            <path d="M300 80 Q320 60 300 40" stroke="#166534" stroke-width="3" opacity="0.4"/>
            <path d="M100 100 Q80 80 100 60" stroke="#166534" stroke-width="3" opacity="0.4"/>
        </g>
    </svg>