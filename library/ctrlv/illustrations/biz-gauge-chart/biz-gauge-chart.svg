<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <ellipse cx="200" cy="270" rx="140" ry="10" fill="#E2E8F0" opacity="0.6"/>
            
            <g class="anim-float">
                <!-- Gauge Outer Rim -->
                <path d="M80 220 A 120 120 0 0 1 320 220" stroke="#334155" stroke-width="40" fill="none" stroke-linecap="round"/>
                
                <!-- Gauge Inner Colored Tracks -->
                <!-- Red/Low Zone -->
                <path d="M80 220 A 120 120 0 0 1 140 115" stroke="#0ea5e9" stroke-width="38" fill="none" stroke-linecap="round"/>
                <!-- Yellow/Mid Zone -->
                <path d="M140 115 A 120 120 0 0 1 260 115" stroke="#f43f5e" stroke-width="38" fill="none"/>
                <!-- Green/High Zone -->
                <path d="M260 115 A 120 120 0 0 1 320 220" stroke="#6366f1" stroke-width="38" fill="none" stroke-linecap="round"/>
                
                <!-- Tick Marks Matrix -->
                <path d="M85 220 H65 M315 220 H335 M200 105 V85 M120 135 L105 120 M280 135 L295 120" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
                
                <g class="anim-bounce">
                    <!-- Gauge Needle (Animated to High Zone) -->
                    <g class="anim-rotate" style="transform-origin: 200px 220px; animation-duration: 3s;">
                        <!-- Pointing to top right -->
                        <path d="M185 220 L280 140 L215 220 Z" fill="#334155"/>
                        <circle cx="200" cy="220" r="30" fill="#ffffff" stroke="#334155" stroke-width="8"/>
                        <circle cx="200" cy="220" r="10" fill="#0ea5e9"/>
                    </g>
                </g>
                
                <!-- Score / Digital Display -->
                <rect class="anim-pulse" x="160" y="250" width="80" height="30" rx="5" fill="#334155"/>
                <path d="M185 265 H215 M185 270 H205" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
            </g>
          </svg>