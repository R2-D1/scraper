<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
        <!-- Pathway -->
        <path d="M0 260 H400" stroke="var(--border-color)" stroke-width="4" stroke-dasharray="10 10"/>
        
        <!-- Two People silhouettes -->
        <g class="anim-float">
            <!-- Friend 1 -->
            <g transform="translate(140, 0)">
                <circle cx="0" cy="100" r="20" fill="#6366f1"/>
                <path class="anim-slide" d="M0 120 V200 L-15 250 M0 200 L15 250" stroke="#6366f1" stroke-width="12" stroke-linecap="round"/>
                <path d="M0 140 L-20 180" stroke="#6366f1" stroke-width="8" stroke-linecap="round"/>
            </g>
            
            <!-- Friend 2 -->
            <g transform="translate(260, 0)">
                <circle cx="0" cy="100" r="20" fill="#f43f5e"/>
                <path class="anim-slide" style="animation-delay: -0.5s" d="M0 120 V200 L-15 250 M0 200 L15 250" stroke="#f43f5e" stroke-width="12" stroke-linecap="round"/>
                <path d="M0 140 L20 180" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>
            </g>
        </g>
        
        <!-- Dialogue Bubble (Simplified) -->
        <g class="anim-pulse" style="animation-delay: -1s">
            <path d="M200 80 Q220 50 180 50" stroke="#0ea5e9" stroke-width="3" fill="none"/>
        </g>
    </svg>