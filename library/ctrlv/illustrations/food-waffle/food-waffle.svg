                <rect x="110" y="110" width="180" height="140" rx="10" fill="#6366f1"/>
                
                <!-- Grid Patterns -->
                <g fill="#334155" opacity="0.2">
                    <rect x="130" y="130" width="30" height="30" rx="4"/>
                    <rect x="185" y="130" width="30" height="30" rx="4"/>
                    <rect x="240" y="130" width="30" height="30" rx="4"/>
                    
                    <rect x="130" y="185" width="30" height="30" rx="4"/>
                    <rect x="185" y="185" width="30" height="30" rx="4"/>
                    <rect x="240" y="185" width="30" height="30" rx="4"/>
                </g>
                
                <!-- Melting Butter Cube -->
                <g class="anim-bounce">
