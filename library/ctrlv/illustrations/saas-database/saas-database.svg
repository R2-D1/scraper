<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <ellipse cx="200" cy="270" rx="120" ry="10" fill="#E2E8F0"/>
            <g class="anim-bounce">
                <!-- Database Cylinders -->
                <!-- Bottom Disk -->
                <ellipse cx="200" cy="220" rx="80" ry="30" fill="#334155"/>
                <path d="M120 180 V220 A 80 30 0 0 0 280 220 V180 Z" fill="#6366f1"/>
                <ellipse cx="200" cy="180" rx="80" ry="30" fill="#6366f1" opacity="0.8"/>
                
                <!-- Middle Disk -->
                <ellipse cx="200" cy="180" rx="80" ry="30" fill="#334155"/>
                <path d="M120 140 V180 A 80 30 0 0 0 280 180 V140 Z" fill="#f43f5e"/>
                <ellipse cx="200" cy="140" rx="80" ry="30" fill="#f43f5e" opacity="0.8"/>
                
                <!-- Top Disk -->
                <ellipse cx="200" cy="140" rx="80" ry="30" fill="#334155"/>
                <path d="M120 100 V140 A 80 30 0 0 0 280 140 V100 Z" fill="#0ea5e9"/>
                <ellipse cx="200" cy="100" rx="80" ry="30" fill="#0ea5e9" opacity="0.8"/>
                
                <!-- Front light indicators -->
                <circle class="anim-glow" cx="200" cy="200" r="4" fill="white"/>
                <circle class="anim-glow" style="animation-delay: -0.4s;" cx="200" cy="160" r="4" fill="white"/>
                <circle class="anim-glow" style="animation-delay: -0.8s;" cx="200" cy="120" r="4" fill="white"/>
            </g>
            
            <!-- Query/Data lines circling it -->
            <path class="anim-draw" d="M80 140 C80 60 320 60 320 140 C320 220 80 220 80 140" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 10" opacity="0.4"/>
          </svg>