<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <g class="anim-float">
                <!-- Old Framework (Grid) -->
                <g opacity="0.4" stroke="#334155" stroke-width="4">
                    <rect x="80" y="90" width="80" height="80" rx="5" fill="none"/>
                    <line x1="120" y1="90" x2="120" y2="170"/>
                    <line x1="80" y1="130" x2="160" y2="130"/>
                </g>
                
                <!-- Transforming Arrow -->
                <g class="anim-data">
                    <path d="M170 130 H230 M220 115 L235 130 L220 145" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
