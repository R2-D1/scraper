<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <ellipse cx="200" cy="270" rx="160" ry="12" fill="#E2E8F0" opacity="0.6"/>
            <!-- Stage Base -->
            <ellipse cx="200" cy="230" rx="100" ry="20" fill="#334155"/>
            <ellipse cx="200" cy="225" rx="90" ry="15" fill="#6366f1"/>
            
            <!-- Hologram Projector Rings -->
            <ellipse class="anim-rotate"  cx="200" cy="225" rx="70" ry="10" fill="none" stroke="#0ea5e9" stroke-width="2"/>
            <ellipse class="anim-rotate"  cx="200" cy="225" rx="50" ry="8" fill="none" stroke="#f43f5e" stroke-width="2"/>
            
            <!-- Holographic DJ/Artist -->
            <g class="anim-float">
                <path d="M180 200 L220 200 L210 140 L190 140 Z" fill="#f43f5e" opacity="0.8"/>
                <circle cx="200" cy="120" r="15" fill="#f43f5e" opacity="0.8"/>
                <!-- DJ Desk -->
                <rect x="170" y="200" width="60" height="25" rx="4" fill="#6366f1"/>
                <circle class="anim-pulse" cx="185" cy="210" r="8" fill="#334155"/>
                <circle class="anim-pulse" cx="215" cy="210" r="8" fill="#334155"/>
            </g>
            
            <!-- Light Beams -->
            <path class="anim-glow" d="M120 230 L80 60 L100 50 Z" fill="#0ea5e9" opacity="0.2"/>
            <path class="anim-glow" d="M280 230 L320 60 L300 50 Z" fill="#0ea5e9" opacity="0.2"/>
            
            <!-- Floating Notes -->
            <path class="anim-data" d="M220 180 Q250 140 280 100" stroke="#0ea5e9" stroke-width="4" stroke-dasharray="5 15" fill="none" stroke-linecap="round"/>
            <path class="anim-data" style="animation-duration: 4s;" d="M180 180 Q150 140 120 100" stroke="#0ea5e9" stroke-width="4" stroke-dasharray="5 15" fill="none" stroke-linecap="round"/>
          </svg>