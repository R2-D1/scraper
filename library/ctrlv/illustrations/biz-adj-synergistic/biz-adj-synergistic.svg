<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <g class="anim-float">
                <!-- Large Top Gear -->
                <g class="anim-rotate" >
                    <circle cx="200" cy="100" r="45" fill="#6366f1"/>
                    <path d="M190 40 H210 V160 H190 Z M140 90 H260 V110 H140 Z" fill="#6366f1"/>
                    <circle cx="200" cy="100" r="15" fill="#ffffff"/>
                </g>
                <!-- Small Left Gear -->
                <g class="anim-rotate" >
                    <circle cx="150" cy="180" r="30" fill="#f43f5e"/>
                    <path d="M140 140 H160 V220 H140 Z M110 170 H190 V190 H110 Z" fill="#f43f5e"/>
                    <circle cx="150" cy="180" r="10" fill="#ffffff"/>
                </g>
                <!-- Small Right Gear -->
                <g class="anim-rotate" >
                    <circle cx="250" cy="180" r="30" fill="#0ea5e9"/>
                    <path d="M240 140 H260 V220 H240 Z M210 170 H290 V190 H210 Z" fill="#0ea5e9"/>
                    <circle cx="250" cy="180" r="10" fill="#ffffff"/>
                </g>
                <!-- Connection Sparks -->
                <circle class="anim-pulse" cx="170" cy="140" r="6" fill="#0ea5e9"/>
                <circle class="anim-pulse" style="animation-delay: 0.5s;" cx="230" cy="140" r="6" fill="#f43f5e"/>
            </g>
          </svg>