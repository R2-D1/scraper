<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <!-- Observatory Dome -->
            <path d="M120 250 V180 H280 V250 Z" fill="#6366f1"/>
            <path class="anim-float" d="M120 180 A80 80 0 0 1 280 180 Z" fill="#6366f1"/>
            
            <!-- Opening -->
            <path class="anim-float" d="M200 180 L230 110 A80 80 0 0 0 200 100 Z" fill="#334155" opacity="0.8"/>
            
            <!-- Telescope sticking out -->
            <g transform="rotate(30 200 140)">
                <rect class="anim-bounce" x="180" y="80" width="30" height="90" rx="4" fill="#f43f5e" />
            </g>
            <g transform="rotate(30 220 50)">
                <rect class="anim-bounce" x="220" y="50" width="40" height="15" rx="4" fill="#334155" />
            </g>
            
            <!-- Beam of light/sight -->
            <path class="anim-glow" d="M280 60 L360 20 L380 70 Z" fill="#0ea5e9" opacity="0.2"/>
            <circle class="anim-glow" cx="350" cy="40" r="5" fill="#0ea5e9"/>
            <circle class="anim-glow" cx="370" cy="25" r="3" fill="#0ea5e9"/>
          </svg>