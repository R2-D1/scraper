<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <g class="anim-bounce">
                <!-- Desk/Document -->
                <rect x="150" y="180" width="100" height="60" fill="#ffffff" stroke="#334155" stroke-width="4"/>
                <path d="M160 200 H240 M160 220 H200" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
                
                <!-- Handshake Shake effect -->
                <g class="anim-rotate" >
                    <!-- Left Sleeve & Hand -->
                    <path class="anim-draw" d="M60 120 L160 140" stroke="#6366f1" stroke-width="30" stroke-linecap="round"/>
                    <path d="M140 140 C140 120 190 120 200 140 C190 160 140 160 140 140 Z" fill="#f43f5e"/>
                    
                    <!-- Right Sleeve & Hand -->
                    <path class="anim-draw" d="M340 120 L240 140" stroke="#334155" stroke-width="30" stroke-linecap="round"/>
                    <path d="M260 140 C260 120 210 120 200 140 C210 160 260 160 260 140 Z" fill="#0ea5e9" opacity="0.8"/>
                </g>
                <circle class="anim-pulse" cx="200" cy="140" r="20" fill="#0ea5e9" opacity="0.3"/>
            </g>
          </svg>