<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <g class="anim-float">
                <!-- Tablet / Screen -->
                <rect x="100" y="50" width="200" height="200" rx="15" fill="#ffffff" stroke="#334155" stroke-width="8"/>
                <circle cx="200" cy="230" r="8" fill="#334155"/>
                
                <!-- Medical Cross Background -->
                <g class="anim-pulse">
                    <path d="M180 80 H220 V120 H260 V160 H220 V200 H180 V160 H140 V120 H180 Z" fill="#f43f5e" opacity="0.2"/>
                </g>
                
                <!-- Stethoscope forming a heart/connection -->
                <path class="anim-draw" d="M140 100 C140 70 200 70 200 100 C200 130 170 160 170 190" stroke="#6366f1" stroke-width="8" stroke-linecap="round" fill="none"/>
                
                <ellipse cx="140" cy="100" rx="15" ry="5" fill="#6366f1" transform="rotate(-30 140 100)"/>
                <circle class="anim-bounce" cx="170" cy="200" r="15" fill="#0ea5e9"/>
                <circle cx="170" cy="200" r="5" fill="#ffffff"/>
                
                <!-- Connection Signal -->
                <g transform="translate(240, 90)">
                    <g class="anim-pulse">
                    <path d="M0 20 A 20 20 0 0 0 20 0 M5 15 A 10 10 0 0 0 15 5" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" fill="none"/>
                    <circle cx="0" cy="0" r="4" fill="#0ea5e9"/>
                </g>
                </g>
            </g>
          </svg>