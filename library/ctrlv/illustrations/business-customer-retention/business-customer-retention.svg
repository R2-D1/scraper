                    <path d="M160 160 Q200 120 240 160 Z" fill="#6366f1"/>
                    
                    <!-- Star Badge -->
                    <path class="anim-rotate" d="M200 130 L205 145 H220 L208 155 L212 170 L200 160 L188 170 L192 155 L180 145 H195 Z" fill="#0ea5e9"/>
