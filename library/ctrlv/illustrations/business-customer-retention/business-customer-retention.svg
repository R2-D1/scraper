<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <g class="anim-float">
                <!-- Platform / Base Hands -->
                <path d="M100 240 Q150 200 200 220 Q250 200 300 240" stroke="#334155" stroke-width="20" stroke-linecap="round" fill="none"/>
                <path d="M100 240 Q150 200 200 220 Q250 200 300 240" stroke="#f43f5e" stroke-width="12" stroke-linecap="round" fill="none"/>
                <path d="M180 205 L190 215 M220 205 L210 215" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
                
                <!-- Glowing Aura -->
                <circle class="anim-pulse" cx="200" cy="120" r="60" fill="#0ea5e9" opacity="0.2"/>
