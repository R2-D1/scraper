<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <g class="anim-float">
                <!-- Center Intersection/Connection -->
                <circle class="anim-pulse" cx="200" cy="150" r="50" fill="#ffffff" stroke="#334155" stroke-width="8"/>
                <circle class="anim-pulse" style="animation-delay: 0.2s;" cx="200" cy="150" r="30" fill="#0ea5e9"/>
                
                <!-- Hand 1 (Top Left) -->
                <g transform="translate(130, 80) rotate(45)">
                    <g class="anim-bounce">
                    <path d="M-20 -60 v40 a20 20 0 0 0 40 0 v-40 Z" fill="#6366f1"/>
                    <path d="M-20 -20 h40" stroke="#ffffff" stroke-width="4"/>
                </g>
                </g>
                
                <!-- Hand 2 (Top Right) -->
                <g transform="translate(270, 80) rotate(-45)">
                    <g class="anim-bounce" style="animation-delay: 0.2s;">
                    <path d="M-20 -60 v40 a20 20 0 0 0 40 0 v-40 Z" fill="#f43f5e"/>
                    <path d="M-20 -20 h40" stroke="#ffffff" stroke-width="4"/>
                </g>
                </g>
                
                <!-- Hand 3 (Bottom Left) -->
                <g transform="translate(130, 220) rotate(135)">
                    <g class="anim-bounce" style="animation-delay: 0.4s;">
                    <path d="M-20 -60 v40 a20 20 0 0 0 40 0 v-40 Z" fill="#334155"/>
                    <path d="M-20 -20 h40" stroke="#ffffff" stroke-width="4"/>
                </g>
                </g>
                
                <!-- Hand 4 (Bottom Right) -->
                <g transform="translate(270, 220) rotate(-135)">
                    <g class="anim-bounce" style="animation-delay: 0.6s;">
                    <path d="M-20 -60 v40 a20 20 0 0 0 40 0 v-40 Z" fill="#6366f1"/>
                    <path d="M-20 -20 h40" stroke="#ffffff" stroke-width="4"/>
                </g>
                </g>
                
                <!-- Sparks of synergy -->
                <circle cx="200" cy="70" r="6" fill="#0ea5e9"/>
                <circle cx="200" cy="230" r="6" fill="#0ea5e9"/>
                <circle cx="120" cy="150" r="6" fill="#0ea5e9"/>
                <circle cx="280" cy="150" r="6" fill="#0ea5e9"/>
            </g>
          </svg>