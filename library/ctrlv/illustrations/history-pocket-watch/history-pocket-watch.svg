<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <ellipse cx="200" cy="270" rx="100" ry="10" fill="#E2E8F0"/>
            <g class="anim-float">
                <!-- Chain -->
                <path class="anim-draw" d="M200 50 Q280 20 320 100 T260 250" stroke="#0ea5e9" stroke-width="6" stroke-dasharray="10 4" stroke-linecap="round" fill="none"/>
                
                <!-- Watch Ring / Crown -->
                <circle cx="200" cy="65" r="15" fill="none" stroke="#0ea5e9" stroke-width="6"/>
                <rect x="190" y="80" width="20" height="15" fill="#6366f1"/>
                
                <!-- Main Case -->
                <circle cx="200" cy="180" r="80" fill="#0ea5e9"/>
                <circle cx="200" cy="180" r="70" fill="#ffffff"/>
                <circle cx="200" cy="180" r="60" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.3"/>
                
                <!-- Numerals (Abstract marks) -->
                <line x1="200" y1="120" x2="200" y2="130" stroke="#334155" stroke-width="4"/>
                <line x1="200" y1="230" x2="200" y2="240" stroke="#334155" stroke-width="4"/>
                <line x1="140" y1="180" x2="150" y2="180" stroke="#334155" stroke-width="4"/>
                <line x1="250" y1="180" x2="260" y2="180" stroke="#334155" stroke-width="4"/>
                <circle cx="230" cy="150" r="2" fill="#334155"/>
                <circle cx="230" cy="210" r="2" fill="#334155"/>
                <circle cx="170" cy="150" r="2" fill="#334155"/>
                <circle cx="170" cy="210" r="2" fill="#334155"/>
                
                <!-- Hands -->
                <g class="anim-rotate" >
                    <!-- Minute Hand -->
                    <line x1="200" y1="180" x2="200" y2="135" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
                </g>
                <g class="anim-rotate" >
                    <!-- Hour Hand (static in animation but angled) -->
                    <line x1="200" y1="180" x2="230" y2="180" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>
                </g>
                <circle cx="200" cy="180" r="6" fill="#f43f5e"/>
                
                <!-- Exposed small gear (complication) -->
                <circle class="anim-rotate"  cx="200" cy="210" r="15" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-dasharray="4 4"/>
                <line x1="200" y1="210" x2="200" y2="200" stroke="#334155" stroke-width="2"/>
            </g>
          </svg>