<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <g class="anim-float">
                <!-- Zen Garden aesthetic -->
                <!-- Floating Peak -->
                <path class="anim-bounce" d="M120 220 L200 80 L280 220 Z" fill="#6366f1" opacity="0.2"/>
                <path class="anim-draw" d="M120 220 L200 80 L280 220" stroke="#334155" stroke-width="8" stroke-linecap="round" fill="none"/>
                
                <!-- Ripples -->
                <g class="anim-pulse" >
                    <circle cx="200" cy="220" r="40" stroke="#f43f5e" stroke-width="2" fill="none"/>
                    <circle cx="200" cy="220" r="60" stroke="#f43f5e" stroke-width="1" fill="none" opacity="0.5"/>
                </g>
                
                <!-- Balanced Stones -->
                <g class="anim-bounce" style="animation-duration: 4s;">
                    <ellipse cx="200" cy="210" rx="30" ry="15" fill="#334155"/>
                    <ellipse cx="200" cy="180" rx="20" ry="10" fill="#6366f1"/>
                    <ellipse cx="200" cy="160" rx="12" ry="6" fill="#0ea5e9"/>
                </g>
                
                <!-- Rising Spark of Focus -->
                <circle class="anim-pulse" cx="200" cy="80" r="15" fill="#0ea5e9" opacity="0.3"/>
                <circle cx="200" cy="80" r="8" fill="#0ea5e9"/>
            </g>
          </svg>