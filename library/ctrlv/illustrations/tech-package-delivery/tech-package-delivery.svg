<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <g class="anim-float">
                <!-- Parcel Box -->
                <g class="anim-bounce">
                    <rect x="120" y="100" width="160" height="140" rx="4" fill="#ffffff" stroke="#334155" stroke-width="8"/>
                    <!-- Tape -->
                    <rect x="120" y="160" width="160" height="20" fill="#6366f1" opacity="0.6"/>
                    <path d="M200 100 V240" stroke="#334155" stroke-width="4" opacity="0.2"/>
                    
                    <!-- Label -->
                    <rect x="220" y="120" width="40" height="30" rx="2" fill="#f43f5e"/>
                    <path d="M225 130 H255 M225 140 H245" stroke="#ffffff" stroke-width="2"/>
                </g>
                
                <!-- Speed Lines -->
                <g class="anim-draw" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round">
                    <line x1="60" y1="120" x2="100" y2="120"/>
                    <line x1="40" y1="170" x2="90" y2="170"/>
                    <line x1="70" y1="220" x2="110" y2="220"/>
                </g>
                
                <!-- Tracking Node -->
                <circle class="anim-pulse" cx="200" cy="60" r="15" fill="#0ea5e9" opacity="0.3"/>
                <circle cx="200" cy="60" r="6" fill="#0ea5e9"/>
                <path d="M200 60 L200 100" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4 4"/>
            </g>
          </svg>