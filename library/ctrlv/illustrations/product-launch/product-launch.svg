<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <ellipse cx="200" cy="270" rx="130" ry="10" fill="#E2E8F0"/>
            <g class="anim-float">
                <!-- Background Glow -->
                <circle class="anim-pulse" cx="200" cy="180" r="100" fill="#ffffff" opacity="0.3"/>
                
                <!-- Open Cardboard Box -->
                <path d="M140 240 L260 240 L280 180 H120 Z" fill="#334155"/>
                <!-- Box Flaps -->
                <path class="anim-bounce" d="M120 180 L80 200 L120 240 Z" fill="#6366f1"/>
                <path class="anim-bounce" style="animation-delay: 0.2s;" d="M280 180 L320 200 L280 240 Z" fill="#6366f1"/>
                <path class="anim-bounce" style="animation-delay: 0.1s;" d="M120 180 L200 150 L280 180 Z" fill="#f43f5e"/>
                
                <!-- Product Emerging -->
                <g class="anim-bounce" style="animation-duration: 4s;">
                    <rect x="170" y="80" width="60" height="90" rx="10" fill="#6366f1"/>
                    <rect x="180" y="90" width="40" height="60" rx="4" fill="white" opacity="0.8"/>
                    <circle class="anim-glow" cx="200" cy="120" r="15" fill="#0ea5e9"/>
                </g>
                
                <!-- Sparkles + Magic -->
                <path class="anim-data" d="M120 100 L130 110 M270 90 L260 100 M200 50 V70 M160 70 L170 80 M240 70 L230 80" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>
                <circle class="anim-pulse" cx="130" cy="120" r="4" fill="#0ea5e9"/>
                <circle class="anim-pulse" cx="270" cy="130" r="5" fill="#f43f5e"/>
            </g>
          </svg>