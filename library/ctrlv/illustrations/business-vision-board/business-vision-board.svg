<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <g class="anim-float">
                <!-- Corkboard / Canvas -->
                <rect x="50" y="40" width="300" height="220" rx="8" fill="#ffffff" stroke="#334155" stroke-width="8"/>
                
                <!-- Strings/Connections -->
                <path class="anim-draw" d="M110 100 L200 130 L280 90 M200 130 L250 200 M200 130 L130 190" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
                
                <!-- Card 1 (Top Left) -->
                <g transform="translate(110, 100)">
                    <rect x="-30" y="-30" width="60" height="60" rx="4" fill="#6366f1" transform="rotate(-10)"/>
                    <circle class="anim-pulse" cx="0" cy="0" r="10" fill="#ffffff"/>
                    <circle cx="-20" cy="-20" r="4" fill="#334155"/> <!-- Pin -->
                </g>
                
                <!-- Card 2 (Top Right) -->
                <g transform="translate(280, 90)">
                    <rect x="-30" y="-20" width="60" height="40" rx="4" fill="#f43f5e" transform="rotate(15)"/>
                    <g transform="rotate(15)">
                <path class="anim-pulse" style="animation-delay: 0.2s;" d="M-10 5 L0 -5 L10 5" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />
            </g>
                    <circle cx="0" cy="-15" r="4" fill="#334155"/>
                </g>
                
                <!-- Card 3 (Center) -->
                <g transform="translate(200, 130)">
                    <circle cx="0" cy="0" r="30" fill="#ffffff" stroke="#334155" stroke-width="6"/>
                    <path class="anim-bounce" d="M-10 0 L0 -10 L10 0 L0 10 Z" fill="#0ea5e9"/>
                    <circle cx="0" cy="-35" r="4" fill="#0ea5e9"/>
                </g>
                
                <!-- Card 4 (Bottom Right) -->
                <g transform="translate(250, 200)">
                    <rect x="-25" y="-30" width="50" height="60" rx="4" fill="#334155" opacity="0.8" transform="rotate(-5)"/>
                    <circle class="anim-pulse" style="animation-delay: 0.4s;" cx="0" cy="0" r="12" fill="#6366f1"/>
                    <circle cx="-15" cy="-20" r="4" fill="#0ea5e9"/>
                </g>
                
                <!-- Card 5 (Bottom Left) -->
                <g transform="translate(130, 190)">
                    <rect x="-40" y="-20" width="80" height="40" rx="4" fill="#f43f5e"/>
                    <path d="M-20 0 H20" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
                    <circle cx="0" cy="-15" r="4" fill="#334155"/>
                </g>
            </g>
          </svg>