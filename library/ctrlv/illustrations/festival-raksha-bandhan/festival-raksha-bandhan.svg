            <path class="anim-draw" d="M60 160 C110 110 160 210 210 160 C260 110 310 210 360 160" stroke="#6366f1" stroke-width="6" fill="none" stroke-linecap="round" style="animation-delay: 0.2s;"/>
            <g class="anim-bounce">
