<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <g class="anim-float">
                <!-- Clock Face -->
                <circle cx="200" cy="150" r="90" fill="#ffffff" stroke="#6366f1" stroke-width="12"/>
                
                <!-- Inner Progress/Circle -->
                <circle class="anim-pulse" cx="200" cy="150" r="70" stroke="#f43f5e" stroke-width="20" stroke-dasharray="20 15" fill="none"/>
                
                <!-- Infinity Loop/Hands -->
                <g class="anim-rotate" >
                    <path d="M200 150 L200 100" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
                    <path d="M200 150 L240 180" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>
                    <circle cx="200" cy="150" r="8" fill="#334155"/>
                </g>
                
                <!-- 24 Text -->
                <rect class="anim-glow" x="120" y="70" width="60" height="40" rx="10" fill="#0ea5e9"/>
                <path d="M140 80 Q150 80 150 90 Q140 100 130 100 H150 M165 80 V100 M165 90 H175 V100 M175 80 V100" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
                
                <!-- 7 Text -->
                <rect class="anim-glow" x="220" y="190" width="40" height="40" rx="10" fill="#6366f1"/>
                <path d="M230 200 H250 L235 220" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
            </g>
          </svg>