<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <g class="anim-float">
                <!-- Padlock Body -->
                <rect x="120" y="120" width="160" height="130" rx="12" fill="#ffffff" stroke="#334155" stroke-width="8"/>
                
                <!-- Padlock Shackle -->
                <path class="anim-draw" d="M160 120 V80 C160 50 240 50 240 80 V120" stroke="#334155" stroke-width="12" stroke-linecap="round" fill="none"/>
                
                <!-- Digital PIN Display -->
                <rect x="150" y="160" width="100" height="40" rx="4" fill="#334155" opacity="0.1"/>
                <g transform="translate(160, 185)">
                    <g class="anim-pulse" >
                    <circle cx="10" cy="0" r="4" fill="#6366f1"/>
                    <circle cx="30" cy="0" r="4" fill="#6366f1"/>
                    <circle cx="50" cy="0" r="4" fill="#6366f1"/>
                    <circle cx="70" cy="0" r="4" fill="#6366f1"/>
                </g>
                </g>
                
                <!-- Status Light -->
                <circle class="anim-pulse" cx="240" cy="140" r="6" fill="#f43f5e"/>
                
                <!-- Shield Icon Overlay -->
                <path class="anim-bounce" d="M200 210 Q220 210 220 230 Q200 250 180 230 Q180 210 200 210 Z" fill="#0ea5e9" opacity="0.4"/>
            </g>
          </svg>