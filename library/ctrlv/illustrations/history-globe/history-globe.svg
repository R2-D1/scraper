<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <ellipse cx="200" cy="270" rx="120" ry="10" fill="#E2E8F0"/>
            <g class="anim-bounce">
                <!-- Stand Base -->
                <path d="M160 260 C160 240 240 240 240 260 Z" fill="#334155"/>
                <rect x="195" y="200" width="10" height="50" fill="#334155"/>
                <!-- Stand Arc -->
                <path d="M200 210 A 90 90 0 0 0 200 30" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>
                
                <!-- Globe Sphere -->
                <circle cx="200" cy="120" r="70" fill="#f43f5e" opacity="0.3"/>
                <circle class="anim-pulse" cx="200" cy="120" r="70" fill="none" stroke="#f43f5e" stroke-width="4"/>
                
                <!-- Latitude / Longitude Lines -->
                <path d="M130 120 H270 M200 50 V190" stroke="#f43f5e" stroke-width="2" opacity="0.5"/>
                <ellipse cx="200" cy="120" rx="40" ry="70" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.5"/>
                <ellipse cx="200" cy="120" rx="70" ry="40" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.5"/>
                
                <g class="anim-rotate" >
                    <!-- Continents / Map Abstract -->
                    <path class="anim-draw" d="M150 90 Q170 80 180 100 T190 140 Q170 160 160 150 T140 120 Z" fill="#6366f1"/>
                    <path class="anim-draw" d="M220 100 Q240 90 250 120 T240 160 Q210 170 200 150 T220 100 Z" fill="#6366f1"/>
                    <path class="anim-draw" d="M240 60 Q250 70 260 65 Z" fill="#6366f1"/>
                    <!-- Ships path dotted line -->
                    <path d="M130 140 Q200 180 270 120" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="5 5" fill="none"/>
                    <!-- X marks the spot -->
                    <path d="M265 115 L275 125 M275 115 L265 125" stroke="#334155" stroke-width="2"/>
                </g>
            </g>
          </svg>