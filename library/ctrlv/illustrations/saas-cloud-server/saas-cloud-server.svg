<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[*{animation:none!important}]]></style>
            <g class="anim-bounce">
                <!-- Server Racks -->
                <rect x="120" y="140" width="160" height="120" rx="8" fill="#334155"/>
                
                <!-- Server Units -->
                <rect class="anim-pulse" x="130" y="150" width="140" height="30" rx="4" fill="#6366f1"/>
                <rect class="anim-pulse" style="animation-delay: -0.5s;" x="130" y="190" width="140" height="30" rx="4" fill="#6366f1"/>
                <rect class="anim-pulse" style="animation-delay: -1s;" x="130" y="230" width="140" height="30" rx="4" fill="#6366f1"/>
                
                <!-- Lights and Details -->
                <g fill="#0ea5e9">
                    <circle class="anim-glow" cx="150" cy="165" r="4"/>
                    <circle class="anim-glow" style="animation-delay: -0.3s;" cx="170" cy="165" r="4"/>
                    <circle class="anim-glow" style="animation-delay: -0.6s;" cx="150" cy="205" r="4"/>
                    <circle class="anim-glow" style="animation-delay: -0.9s;" cx="170" cy="205" r="4"/>
                    <circle class="anim-glow" style="animation-delay: -1.2s;" cx="150" cy="245" r="4"/>
                    <circle class="anim-glow" style="animation-delay: -1.5s;" cx="170" cy="245" r="4"/>
                </g>
                <g stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5">
                    <line x1="220" y1="165" x2="250" y2="165"/>
                    <line x1="220" y1="205" x2="250" y2="205"/>
                    <line x1="220" y1="245" x2="250" y2="245"/>
                </g>
            </g>
            
            <!-- Cloud computing above -->
            <g class="anim-float">
                <path d="M120 100 C120 70 160 60 180 60 C210 30 270 50 280 80 C310 80 320 120 280 120 C280 120 120 120 120 100 Z" fill="#0ea5e9" opacity="0.9"/>
                <path class="anim-draw" d="M200 120 V140 M160 115 V140 M240 115 V140" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 4"/>
                <!-- Data particles going up and down -->
                <circle class="anim-data" cx="200" cy="140" r="3" fill="#6366f1"/>
                <circle class="anim-data" style="animation-delay: -0.5s;" cx="160" cy="140" r="3" fill="#6366f1"/>
                <circle class="anim-data" style="animation-delay: -1s;" cx="240" cy="140" r="3" fill="#6366f1"/>
            </g>
          </svg>